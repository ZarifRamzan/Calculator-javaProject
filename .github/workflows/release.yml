name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "17"
  MAVEN_ARGS: -B -ntp -Dstyle.color=always

jobs:
  release:
    name: "Release · Tagged build"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so GitHub can generate release notes between tags.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Resolve release version
        id: version
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${TAG}"

      - name: Build and verify release artifact
        run: mvn $MAVEN_ARGS -Drevision=${{ steps.version.outputs.version }} verify

      - name: Generate checksums
        working-directory: target
        run: |
          sha256sum ./*.jar ./bom.json > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          PRE_RELEASE=""
          if [[ "${TAG}" == *-* ]]; then
            PRE_RELEASE="--prerelease"
          fi
          gh release create "${TAG}" \
            target/*.jar \
            target/bom.json \
            target/SHA256SUMS \
            --title "CalculatorApp ${TAG}" \
            --generate-notes \
            ${PRE_RELEASE}

      - name: Write job summary
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "## Released ${TAG}"
            echo ""
            echo "- Maven version: \`${VERSION}\`"
            echo "- Artifacts: JAR, CycloneDX SBOM, SHA256SUMS"
            echo "- Package: [GitHub Packages](https://github.com/ZarifRamzan/Calculator-javaProject/packages)"
          } >> "$GITHUB_STEP_SUMMARY"
