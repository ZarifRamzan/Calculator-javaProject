name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  MAVEN_ARGS: -B -ntp -Dstyle.color=always

jobs:
  # Cheap gate that runs first: documentation-only changes skip the heavy jobs.
  # Implemented as a job condition instead of "paths-ignore" so that required
  # status checks are always reported (a skipped job counts as successful).
  changes:
    name: "Detect changes"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history is required to diff the change against its base commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "${EVENT_NAME}" != "push" && "${EVENT_NAME}" != "pull_request" ]]; then
            echo "Scheduled or manual run: full pipeline"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${REF_TYPE}" == "tag" ]]; then
            echo "Tag build: full pipeline"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE="${BASE_SHA}"
          if [[ -z "${BASE}" || "${BASE}" == "0000000000000000000000000000000000000000" ]]; then
            BASE="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi
          if ! git diff --name-only "${BASE}" "${GITHUB_SHA}" > changed.txt 2>/dev/null; then
            echo "Cannot diff against ${BASE}: running the full pipeline"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files:"
          cat changed.txt
          CODE=false
          while IFS= read -r file; do
            if [[ -z "${file}" ]]; then
              continue
            fi
            case "${file}" in
              docs/*|*.md|LICENSE|.gitignore|.editorconfig)
                continue
                ;;
              *)
                CODE=true
                ;;
            esac
          done < changed.txt
          if [[ "${CODE}" == "true" ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Executable content changed: running the full pipeline"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Documentation-only change: build, test, security and deploy are skipped"
          fi

  validate:
    name: "Validate · Lint & Format"
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Maven Enforcer (toolchain & POM hygiene)
        run: mvn $MAVEN_ARGS enforcer:enforce

      - name: Checkstyle (static analysis)
        run: mvn $MAVEN_ARGS checkstyle:check

      - name: Spotless (formatting)
        run: mvn $MAVEN_ARGS spotless:check

      - name: Upload static analysis report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkstyle-report
          path: target/checkstyle-result.xml
          if-no-files-found: ignore
          retention-days: 7

  test:
    name: "Test · Unit & Coverage"
    needs: [changes, validate]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Unit tests with coverage gate
        run: mvn $MAVEN_ARGS verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: "Build · Package"
    needs: [changes, validate, test]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Package executable JAR and SBOM
        run: mvn $MAVEN_ARGS -DskipTests -Djacoco.skip=true package

      - name: Verify artifact
        run: |
          ls -l target/*.jar target/bom.json
          unzip -p target/*.jar META-INF/MANIFEST.MF
          sha256sum target/*.jar target/bom.json

      - name: Upload JAR and SBOM
        uses: actions/upload-artifact@v7
        with:
          name: calculator-app-dist
          path: |
            target/*.jar
            target/bom.json
          if-no-files-found: error
          retention-days: 14

  security-sca:
    name: "Security · Dependencies, Secrets & Config"
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Pinned to a commit SHA on purpose: third-party actions must not float.
      - name: Trivy scan (vulnerabilities, secrets, misconfiguration)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"

      - name: Upload Trivy results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  codeql:
    name: "Security · SAST (CodeQL)"
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          queries: security-extended

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin

  deploy:
    name: "Deploy · GitHub Packages"
    needs: [changes, build, test, security-sca, codeql]
    if: |
      needs.changes.outputs.code == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://github.com/ZarifRamzan/Calculator-javaProject/packages
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Resolve deployment version
        id: version
        run: |
          BASE="$(mvn -q -DforceStdout help:evaluate -Dexpression=revision | tail -n 1)"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${BASE}-main.${GITHUB_RUN_NUMBER}"
          fi
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Deploying version ${VERSION}"

      - name: Configure Maven for GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'SETTINGS'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          SETTINGS

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          mvn $MAVEN_ARGS -Drevision=${{ steps.version.outputs.value }}
          -DskipTests -Djacoco.skip=true deploy
